plugins {
    id 'java'
    id 'org.springframework.boot' version '3.1.3'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'jacoco'
    id 'checkstyle'
    id "org.sonarqube" version "5.1.0.4882"
}

group = 'com.apaline.ecolens'
version = '1.0'
archivesBaseName="ecolens-app"

bootJar {
    mainClass = 'com.apaline.ecolens.Application'
}

sourceSets {
    main {
        java {
            srcDir file('src/main/java')
        }
    }
    unitTest {
        java {
            srcDir file('src/test/java')
        }
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
    integrationTest {
        java {
            srcDir file('src/integration-test/java')
        }
        resources {
            srcDir file('src/integration-test/resources')
        }
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

checkstyle {
    toolVersion = "8.45.1" // You can specify the version you need
    configFile = file("config/checkstyle/checkstyle.xml") // You can customize the config file path
}

tasks.withType(Checkstyle) {
    reports {
        xml.required = false // Disable XML report if not needed
        html.required = false // Disable HTML report
    }
}

repositories {
    mavenCentral()
}

jacoco {
    toolVersion = "0.8.11"
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // https://mvnrepository.com/artifact/jakarta.persistence/jakarta.persistence-api
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'mysql:mysql-connector-java:8.0.11'
    runtimeOnly 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'

    // Add this for Spring Boot test context
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Mocking framework
    testImplementation 'org.mockito:mockito-core:3.11.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    unitTestImplementation.extendsFrom testImplementation
    unitTestRuntimeOnly.extendsFrom testRuntimeOnly
}

task unitTest(type: Test) {
    useJUnitPlatform {
        includeTags 'unit'
    }
    testClassesDirs = sourceSets.unitTest.output.classesDirs
    classpath = sourceSets.unitTest.runtimeClasspath
}

task integrationTest(type: Test) {
    useJUnitPlatform {
        includeTags 'integration'
    }
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
}

test {
    useJUnitPlatform()
    dependsOn unitTest
    dependsOn integrationTest
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        csv.required = true
        xml.required = true
        html.required = false
    }
}

sonar {
    properties {
        property "sonar.projectName","apaline_backend"
        property "sonar.projectKey","apaline_backend"
        property "sonar.qualitygate.wait", true 
        property "sonar.sources", "src/main/java"
        property "sonar.java.binaries", "build/classes/java/main"
        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
    }
}
